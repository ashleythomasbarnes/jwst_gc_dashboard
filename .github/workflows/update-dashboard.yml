name: Update and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test parser
        run: python -m unittest discover -s tests -v

      - name: Fetch current STScI visit report
        run: python scripts/fetch_visits.py

      - name: Validate dashboard files
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool data/visits.json > /dev/null
          node --check assets/app.js

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visits.json
          if git diff --cached --quiet; then
            echo "Visit data is unchanged."
          else
            git commit -m "chore(data): refresh JWST visit status [skip ci]"
            git push
          fi

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
